openapi: 3.0.3
info:
  title: Ghibli Tracker API
  version: 1.1.0
  description: |
    API REST que consome a API pública do Studio Ghibli e mantém uma watchlist pessoal persistida em arquivo JSON local.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000

tags:
  - name: Sistema
  - name: Filmes
  - name: Watchlist

paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Verifica se a aplicação está ativa
      responses:
        "200":
          description: OK

  /api/filmes:
    get:
      tags: [Filmes]
      summary: Busca filmes por título (parcial, case-insensitive)
      parameters:
        - name: titulo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lista de filmes
        "503":
          $ref: "#/components/responses/ApiExternaIndisponivel"

  /api/filmes/{id}:
    get:
      tags: [Filmes]
      summary: Detalhes de um filme específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do filme
        "404":
          description: Filme não encontrado na API externa
        "503":
          $ref: "#/components/responses/ApiExternaIndisponivel"

  /api/watchlist:
    get:
      tags: [Watchlist]
      summary: Lista todos os itens da watchlist (leitura local)
      responses:
        "200":
          description: Lista de itens
        "500":
          $ref: "#/components/responses/ErroInterno"
    post:
      tags: [Watchlist]
      summary: Adiciona filme à watchlist (com snapshot e bloqueio de duplicidade)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filmeId]
              properties:
                filmeId:
                  type: string
      responses:
        "201":
          description: Filme adicionado
        "400":
          description: Erro de validação
        "404":
          description: Filme não encontrado
        "409":
          description: Conflito - já na watchlist
        "500":
          $ref: "#/components/responses/ErroInterno"
        "503":
          $ref: "#/components/responses/ApiExternaIndisponivel"

  /api/watchlist/estatisticas:
    get:
      tags: [Watchlist]
      summary: Obtém resumo estatístico
      responses:
        "200":
          description: Estatísticas (totalFilmes, totalAssistidos, notaMedia)
        "500":
          $ref: "#/components/responses/ErroInterno"

  /api/watchlist/{id}:
    patch:
      tags: [Watchlist]
      summary: Marca item como assistido e permite avaliação (1 a 5)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nota:
                  type: number
      responses:
        "200":
          description: Atualizado
        "400":
          description: Nota inválida
        "404":
          description: Item não encontrado
        "500":
          $ref: "#/components/responses/ErroInterno"
    delete:
      tags: [Watchlist]
      summary: Remove item da watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removido
        "404":
          description: Item não encontrado
        "500":
          $ref: "#/components/responses/ErroInterno"

components:
  schemas:
    Erro:
      type: object
      properties:
        codigo:
          type: string
        mensagem:
          type: string
  responses:
    ApiExternaIndisponivel:
      description: API do Studio Ghibli indisponível, com timeout de 5 segundos ou respondendo com erro
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            timeout:
              summary: Timeout ou falha de rede
              value:
                codigo: API_EXTERNA_INDISPONIVEL
                mensagem: A API do Studio Ghibli demorou a responder ou está fora do ar.
            respostaComErro:
              summary: API externa respondeu com status de erro
              value:
                codigo: API_EXTERNA_INDISPONIVEL
                mensagem: Falha ao comunicar com a API do Studio Ghibli.

    ErroInterno:
      description: Erro inesperado ou falha de armazenamento
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          examples:
            interno:
              summary: Erro não previsto
              value:
                codigo: ERRO_INTERNO_SERVIDOR
                mensagem: Ocorreu um erro interno no servidor.
            armazenamentoLeitura:
              summary: Arquivo de dados corrompido
              value:
                codigo: ERRO_ARMAZENAMENTO
                mensagem: O arquivo de dados da watchlist está corrompido.
            armazenamentoGravacao:
              summary: Falha ao gravar o arquivo
              value:
                codigo: ERRO_ARMAZENAMENTO
                mensagem: Falha ao gravar os dados na watchlist.
